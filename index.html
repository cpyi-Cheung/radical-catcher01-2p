<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>部首大冒險 · 雙人對戰</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(circle at 50% 0%, #1e3a5f 0%, #0b1220 70%);
    font-family:"KaiTi","STKaiti","標楷體","DFKai-SB","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #app{
    position:relative;
    width: min(98vw, 1400px, 150vh);
    aspect-ratio: 1400 / 800;
    border-radius:22px;
    overflow:hidden;
    background:#cfeaff;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 4px rgba(255,255,255,.08);
    touch-action:none;
    user-select:none;
  }
  #game{ display:block; width:100%; height:100%; touch-action:none; }

  #dualHud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding: clamp(6px,1.2%,14px) clamp(12px,2.4%,28px);
    pointer-events:none;
    color:#123152;
    font-weight:800;
    font-size: clamp(12px,1.6vw,18px);
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
    transition: opacity .3s;
    z-index:6;
  }
  #dualHud.hidden{ opacity:0; }
  .player-score{
    display:flex; align-items:center; gap:12px;
    background: rgba(255,255,255,.8);
    backdrop-filter: blur(4px);
    padding: 4px 18px; border-radius: 40px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
  }
  .player-score .name{ font-size:1.1em; color:#0b4a75; }
  .player-score .pts{ font-size:1.6em; color:#0b6fb8; min-width:2.2em; text-align:center; }
  .vs{
    font-size:1.4em; color:#eab308; text-shadow:0 2px 4px rgba(0,0,0,.2);
    background:rgba(255,255,255,.5); padding:2px 16px; border-radius:30px;
  }
  .player-level-tag{
    font-size: clamp(10px,1.2vw,14px);
    background:rgba(255,255,255,.7);
    padding:2px 10px; border-radius:20px;
    color:#39516b;
  }

  .overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:3%;
    background: rgba(8,22,40,.6);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: opacity .25s;
    z-index:10;
  }
  .overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .panel{
    background: rgba(255,255,255,.97);
    border-radius: 28px;
    padding: clamp(16px,2.8vw,36px) clamp(20px,3.2vw,44px);
    width:100%; max-width: 850px; max-height:90%;
    overflow-y:auto;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
    text-align:center;
    color:#1e293b;
  }
  .panel h1{
    margin:0 0 4px;
    font-size: clamp(24px, 3.8vw, 42px);
    letter-spacing:4px;
    color:#0b4a75;
  }
  .sub{ margin:0 0 16px; font-size: clamp(12px,1.6vw,17px); color:#5b7089; }

  .rules{
    text-align:left;
    background:#f1f7fd;
    border-radius:18px;
    padding: clamp(10px,1.6vw,18px) clamp(14px,2.2vw,24px);
    font-size: clamp(11px,1.4vw,15px);
    line-height:1.9;
    color:#39516b;
    margin-bottom:22px;
    border:1px solid #dbeafe;
  }
  .rules b{ color:#0b6fb8; }
  .rules .tag{ background:#dcfce7; color:#15803d; border-radius:6px; padding:0 6px; font-weight:800; }
  .rules .tag2{ background:#fee2e2; color:#b91c1c; border-radius:6px; padding:0 6px; font-weight:800; }

  .levels{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px,1.2vw,14px);
  }
  @media (max-width: 700px){
    .levels{ grid-template-columns: repeat(2, 1fr); }
  }
  .level-card{
    border:none; cursor:pointer;
    border-radius:18px;
    padding: clamp(10px,1.6vw,18px) 6px;
    background: linear-gradient(160deg,#ffffff,#eaf4ff);
    box-shadow: 0 4px 14px rgba(11,74,117,.12);
    border:2px solid transparent;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    font-family: inherit;
    color:#123152;
  }
  .level-card:hover{ transform: translateY(-4px); box-shadow:0 10px 24px rgba(11,74,117,.22); }
  .level-card:active{ transform: translateY(-1px) scale(.98); }
  .level-card .r{
    display:block;
    font-family:"KaiTi","STKaiti","標楷體",serif;
    font-size: clamp(26px, 4.2vw, 46px);
    font-weight:700;
    line-height:1.1;
    margin-bottom:2px;
  }
  .level-card .n{ display:block; font-size: clamp(11px,1.4vw,15px); font-weight:800; }
  .level-card .d{ display:block; font-size: clamp(9px,1.1vw,12px); color:#7b8fa8; margin-top:2px; }
  .level-card.c1 .r{ color:#2b8fe0; } .level-card.c2 .r{ color:#7c5cf0; }
  .level-card.c3 .r{ color:#e08c0b; } .level-card.c4 .r{ color:#db2777; }
  .level-card.c5 .r{ color:#0d9488; } .level-card.c6 .r{ color:#16a34a; }
  .level-card.c7 .r{ color:#92400e; } .level-card.c8 .r{ color:#be123c; }

  .vs-result{
    display:flex; justify-content:space-around; align-items:center;
    margin: 10px 0 20px;
    gap: 10px;
  }
  .vs-side{
    flex:1; padding: 12px 8px; border-radius: 20px;
    background: #f8fafc;
    box-shadow: inset 0 1px 8px rgba(0,0,0,.03);
  }
  .vs-side.winner{
    background: #fef9c3;
    box-shadow: 0 0 0 3px #facc15, 0 8px 20px rgba(250,204,21,.3);
  }
  .vs-side .name-big{ font-size: 1.5em; font-weight: 900; color:#0b4a75; }
  .vs-side .score-big{ font-size: 2.6em; font-weight: 900; color:#0b6fb8; margin: 4px 0; }
  .vs-side .detail{ font-size: 0.9em; color: #64748b; }

  .center-vs{
    font-size: 2.2em; font-weight: 900; color: #eab308;
    text-shadow: 0 2px 0 #b45309;
  }

  .encourage{
    font-size: clamp(16px,2.2vw,24px);
    margin: 16px 0 8px;
    padding: 12px;
    background: #dbeafe;
    border-radius: 40px;
    color: #1e3a8a;
    font-weight: 800;
  }

  .btns{ display:flex; gap: clamp(8px,1.4vw,18px); justify-content:center; flex-wrap:wrap; margin-top: 18px; }
  .btns button{
    font-family:inherit;
    font-size: clamp(13px,1.6vw,18px);
    font-weight:800;
    padding: clamp(8px,1.3vw,14px) clamp(18px,2.6vw,34px);
    border-radius: 40px;
    border:2px solid #d5e3f0;
    background:#fff;
    color:#39516b;
    cursor:pointer;
    transition: all .15s;
    box-shadow: 0 4px 10px rgba(0,0,0,.05);
  }
  .btns button:hover{ transform: translateY(-2px); box-shadow:0 8px 18px rgba(11,74,117,.16); }
  .btns button:active{ transform: translateY(0) scale(.97); }
  .btns button.primary{
    background: linear-gradient(160deg,#3ba9f5,#0b7fd4);
    color:#fff; border-color: transparent;
    box-shadow: 0 6px 18px rgba(11,127,212,.4);
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="game"></canvas>

  <div id="dualHud" class="hidden">
    <div class="player-score">
      <span class="name">🧑‍🎓 玩家 1</span>
      <span class="pts" id="p1Score">0</span>
      <span class="player-level-tag" id="p1LevelTag">水</span>
    </div>
    <div class="vs">VS</div>
    <div class="player-score">
      <span class="player-level-tag" id="p2LevelTag">水</span>
      <span class="pts" id="p2Score">0</span>
      <span class="name">玩家 2 🧑‍🎓</span>
    </div>
  </div>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>部 首 大 冒 險 · 雙 人 對 戰</h1>
      <p class="sub">兩人同時闖關，左右分工，看誰接得準！</p>

      <div class="rules">
        🎮 <b>雙人玩法：</b><br>
        1. 左半邊是 <b>玩家 1</b>（操作：<b>A / D</b> 鍵 或 拖動左側籃子）<br>
        2. 右半邊是 <b>玩家 2</b>（操作：<b>← / →</b> 鍵 或 拖動右側籃子）<br>
        3. 兩人各自接住自己區域內「正確部首」的字 → <span class="tag">+10 分</span><br>
        4. 接錯字或漏接目標字 → <span class="tag2">−5 分</span><br>
        5. 同一關卡，兩邊出現的字完全相同，只是順序不同！<br>
        6. 干擾字以「左右結構」為主，需仔細辨認部首！<br>
        7. 平板可直接用手指拖動自己那一側的籃子。
      </div>

      <div class="levels" id="levelGrid"></div>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div class="panel">
      <h2 style="margin:0 0 6px; color:#0b4a75;">🏆 對戰結果</h2>
      <div class="vs-result" id="vsResultArea"></div>
      <div id="encourageMsg" class="encourage">別灰心，繼續加油！</div>
      <div class="btns">
        <button id="btnRetry">再玩一次</button>
        <button id="btnNext" class="primary">下一關</button>
        <button id="btnMenu">返回選關</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const W = 1400, H = 800;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = W * dpr;
  cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const FONT = '"KaiTi","STKaiti","標楷體","DFKai-SB","PingFang TC","Microsoft JhengHei",sans-serif';

  const GROUND_Y = 700;
  const BASKET_TOP = 620;
  const BASKET_BOTTOM = 730;
  const BASKET_HALF_TOP = 72;
  const BASKET_HALF_BOT = 52;
  const MAX_FALLING = 3;
  const MID_X = 700;

  const TARGET_RATIO = 0.65;

  /* =========================================================
     干擾字庫：以「左右結構」為主，少量整體字
     ========================================================= */

  // 【左右結構】干擾字（部首與各關目標不同，但字形為左右結構）
  const LEFT_RIGHT_OTHERS = [
    // 女部 / 人部 / 手部 / 口部 等常見左右結構
    '媽','姐','妹','她','奶','妙','姓','始',
    '你','他','們','休','住','什','作','位','伙','伴','信','傳','借','使','化','件',
    '吃','叫','嗎','吧','呀','味','命','和',
    '跑','跳','路','跟','足','踢','踩',
    '貓','狗','豬','狼','狐','猴',
    '地','場','城','培','基','堅',
    '玩','球','現','理','環','班',
    '燈','燒','炮','煙','煩','熱',
    '紙','紅','綠','線','織','結','給','練','約','紀','純','級','細','終','經','網',
    '說','話','語','詞','請','誰','謝','認','記','課','讀','講','論','談','訪','許',
    '明','時','晚','晴','暗','暖','暢',
    '林','村','板','杯','桃','梅','校','樹','根','枝','松','柏','橋','椅','桌','棵',
    '江','河','湖','海','洗','清','汗','池','沙','洋','流','活','沒','法','浪','汪',
    '打','拉','把','找','拍','抱','掃','提','推','接','排','掛','換','捉','招','拾',
    '忙','快','怕','情','慢','恨','悄','性',
    '媽','姐','妹','她','奶','妙','姓','始',
    '燈','燒','炮','煙','煩','熱',
    '說','話','語','詞','請','誰','謝','認','記','課','讀','講','論','談','訪','許'
  ];

  // 【整體字】少量保留（上下結構、包圍結構、獨體字）
  const WHOLE_OTHERS = [
    '口','山','月','田','馬','車','門','雲','雨','刀','女','子','大','小','上','下','天','石',
    '花','草','菜','茶','葉','藥','藍','苦','英','落','萬','萱','蕾','萌','芽','苗',
    '想','思','念','意','忘','怎','急','您',
    '休','體','會','合','命','令'
  ];

  /* =========================================================
     關卡資料（每關干擾字使用「左右結構為主 + 少量整體字」）
     ========================================================= */
  const LEVELS = [
    {
      name: '水字部', radical: '水', radicalName: '水字部',
      color1: '#7ec8ff', color2: '#3d9bf0', stroke: '#2b7fd4',
      fallSpeed: 155, interval: 1.5, total: 16,
      targets: ['江','河','湖','海','洗','清','汗','池','沙','洋','流','活','沒','法','浪','汪'],
      others: LEFT_RIGHT_OTHERS
    },
    {
      name: '人字部', radical: '人', radicalName: '人字部',
      color1: '#b9a5ff', color2: '#7c5cf0', stroke: '#6446c9',
      fallSpeed: 160, interval: 1.45, total: 16,
      targets: ['你','他','們','休','住','什','作','位','伙','伴','信','傳','借','使','化','件'],
      others: LEFT_RIGHT_OTHERS
    },
    {
      name: '手字部', radical: '手', radicalName: '手字部',
      color1: '#ffd166', color2: '#f59e0b', stroke: '#c47d06',
      fallSpeed: 165, interval: 1.4, total: 16,
      targets: ['打','拉','把','找','拍','抱','掃','提','推','接','排','掛','換','捉','招','拾'],
      others: LEFT_RIGHT_OTHERS
    },
    {
      name: '心字部', radical: '心', radicalName: '心字部',
      color1: '#ff9ec4', color2: '#ec4899', stroke: '#be185d',
      fallSpeed: 170, interval: 1.4, total: 16,
      targets: ['忙','快','怕','情','慢','恨','悄','性','想','思','念','意','忘','怎','急','您'],
      others: LEFT_RIGHT_OTHERS
    },
    {
      name: '言字部', radical: '言', radicalName: '言字部',
      color1: '#5eead4', color2: '#0d9488', stroke: '#0f766e',
      fallSpeed: 158, interval: 1.5, total: 16,
      targets: ['說','話','語','詞','請','誰','謝','認','記','課','讀','講','論','談','訪','許'],
      others: LEFT_RIGHT_OTHERS
    },
    {
      name: '草字部', radical: '艸', radicalName: '草字部',
      color1: '#86efac', color2: '#16a34a', stroke: '#15803d',
      fallSpeed: 160, interval: 1.5, total: 16,
      targets: ['花','草','菜','茶','葉','藥','藍','苦','英','落','萬','萱','蕾','萌','芽','苗'],
      others: LEFT_RIGHT_OTHERS
    },
    {
      name: '木字部', radical: '木', radicalName: '木字部',
      color1: '#fcd34d', color2: '#92400e', stroke: '#78350f',
      fallSpeed: 162, interval: 1.5, total: 16,
      targets: ['林','村','板','杯','桃','梅','校','樹','根','枝','松','柏','橋','椅','桌','棵'],
      others: LEFT_RIGHT_OTHERS
    },
    {
      name: '糸字部', radical: '糸', radicalName: '糸字部',
      color1: '#fda4af', color2: '#be123c', stroke: '#9f1239',
      fallSpeed: 165, interval: 1.45, total: 16,
      targets: ['紅','綠','紙','線','織','結','給','練','約','紀','純','級','細','終','經','網'],
      others: LEFT_RIGHT_OTHERS
    }
  ];

  let state = 'menu';
  let levelIdx = 0;
  let lv = LEVELS[0];

  const p1Basket = { x: 350, targetX: 350 };
  const p2Basket = { x: 1050, targetX: 1050 };

  let hanziList = [];
  let particles = [];
  let floaters = [];
  let clouds = [];

  let p1Score = 0, p2Score = 0;
  let p1Correct = 0, p1Wrong = 0, p1Missed = 0;
  let p2Correct = 0, p2Wrong = 0, p2Missed = 0;

  let spawnedCount = 0;
  let spawnCooldown = 0;

  let p1Sequence = [];
  let p2Sequence = [];
  let p1Idx = 0, p2Idx = 0;

  let finished = false;
  let endTimer = 0;

  let shakeT = 0;
  let shakeMag = 6;
  let flashAlpha = 0;
  let flashColor = 'rgb(255,80,80)';

  let elapsed = 0;
  const keys = {};

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function hit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  let audioCtx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) { }
  }

  for (let i = 0; i < 7; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 60 + Math.random() * 200,
      s: 0.5 + Math.random() * 0.9,
      sp: 10 + Math.random() * 18
    });
  }

  /* =========================================================
     建立題目序列
     - 目標字使用 targetPool
     - 干擾字：80% 左右結構、20% 整體字（增加難度）
     ========================================================= */
  function buildSequence(level) {
    const n = level.total;
    const tc = Math.round(n * TARGET_RATIO);

    const targetPool = shuffle(level.targets.slice());

    // 干擾字池：80% 左右結構 + 20% 整體字
    const lrPool = shuffle(LEFT_RIGHT_OTHERS.slice());
    const wholePool = shuffle(WHOLE_OTHERS.slice());
    const otherPool = [];
    const oc = n - tc;  // 干擾字數量
    const lrCount = Math.round(oc * 0.8);  // 左右結構佔 80%
    for (let i = 0; i < lrCount; i++) {
      otherPool.push(lrPool[i % lrPool.length]);
    }
    for (let i = 0; i < oc - lrCount; i++) {
      otherPool.push(wholePool[i % wholePool.length]);
    }
    shuffle(otherPool);

    const typeQueue = [];
    for (let i = 0; i < n; i++) typeQueue.push(i < tc);
    shuffle(typeQueue);
    for (let i = 2; i < typeQueue.length; i++) {
      if (typeQueue[i] === typeQueue[i-1] && typeQueue[i] === typeQueue[i-2]) {
        for (let j = i+1; j < typeQueue.length; j++) {
          if (typeQueue[j] !== typeQueue[i]) {
            [typeQueue[i], typeQueue[j]] = [typeQueue[j], typeQueue[i]];
            break;
          }
        }
      }
    }

    let ti = 0, oi = 0;
    const seq = [];
    for (let i = 0; i < n; i++) {
      if (typeQueue[i]) {
        seq.push({ char: targetPool[ti % targetPool.length], isTarget: true });
        ti++;
      } else {
        seq.push({ char: otherPool[oi % otherPool.length], isTarget: false });
        oi++;
      }
    }
    return seq;
  }

  function startLevel(i) {
    levelIdx = i;
    lv = LEVELS[i];

    p1Score = 0; p2Score = 0;
    p1Correct = 0; p1Wrong = 0; p1Missed = 0;
    p2Correct = 0; p2Wrong = 0; p2Missed = 0;

    spawnedCount = 0;
    spawnCooldown = 1.2;
    hanziList = [];
    particles = [];
    floaters = [];

    finished = false;
    endTimer = 0;

    p1Basket.x = 350; p1Basket.targetX = 350;
    p2Basket.x = 1050; p2Basket.targetX = 1050;

    const baseSeq = buildSequence(lv);
    p1Sequence = shuffle(baseSeq.slice());
    p2Sequence = shuffle(baseSeq.slice());
    p1Idx = 0;
    p2Idx = 0;

    shakeT = 0;
    flashAlpha = 0;

    state = 'playing';

    document.getElementById('dualHud').classList.remove('hidden');
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('result').classList.add('hidden');

    document.getElementById('p1LevelTag').textContent = lv.radical;
    document.getElementById('p2LevelTag').textContent = lv.radical;
    document.getElementById('p1Score').textContent = '0';
    document.getElementById('p2Score').textContent = '0';
  }

  function spawnHanzi() {
    let owner;
    const p1Remaining = p1Sequence.length - p1Idx;
    const p2Remaining = p2Sequence.length - p2Idx;

    if (p1Remaining <= 0 && p2Remaining <= 0) return;
    if (p1Remaining <= 0) owner = 2;
    else if (p2Remaining <= 0) owner = 1;
    else {
      let c1 = 0, c2 = 0;
      for (const h of hanziList) {
        if (h.owner === 1) c1++;
        else c2++;
      }
      if (c1 < c2) owner = 1;
      else if (c2 < c1) owner = 2;
      else owner = Math.random() < 0.5 ? 1 : 2;
    }

    let item;
    if (owner === 1) {
      if (p1Idx >= p1Sequence.length) return;
      item = p1Sequence[p1Idx]; p1Idx++;
    } else {
      if (p2Idx >= p2Sequence.length) return;
      item = p2Sequence[p2Idx]; p2Idx++;
    }

    let xMin, xMax;
    if (owner === 1) { xMin = 80; xMax = MID_X - 80; }
    else { xMin = MID_X + 80; xMax = W - 80; }

    hanziList.push({
      char: item.char,
      isTarget: item.isTarget,
      owner: owner,
      x: xMin + Math.random() * (xMax - xMin),
      y: -60,
      phase: Math.random() * Math.PI * 2,
      dead: false
    });
  }

  function burst(x, y, color, count) {
    const n = count || 12;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 160;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        life: 0.5 + Math.random() * 0.3, max: 0.8, color, r: 2.5 + Math.random() * 3.5
      });
    }
  }
  function addFloater(x, y, text, color) {
    floaters.push({ x, y, text, color, life: 0.9 });
  }
  function shake(power) { shakeT = 0.25; shakeMag = power || 6; }
  function flash(color, alpha) { flashColor = color; flashAlpha = alpha; }

  function update(dt) {
    elapsed += dt;

    for (let c of clouds) {
      c.x -= c.sp * dt;
      if (c.x < -240) { c.x = W + 240; c.y = 60 + Math.random() * 200; }
    }

    if (shakeT > 0) shakeT -= dt;
    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2.4);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 900 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= 60 * dt; f.life -= dt;
      if (f.life <= 0) floaters.splice(i, 1);
    }

    if (state !== 'playing') return;

    const keySpeed = 650;
    if (keys['a'] || keys['A']) p1Basket.targetX -= keySpeed * dt;
    if (keys['d'] || keys['D']) p1Basket.targetX += keySpeed * dt;
    p1Basket.targetX = clamp(p1Basket.targetX, BASKET_HALF_TOP + 20, MID_X - 50);
    p1Basket.x += (p1Basket.targetX - p1Basket.x) * Math.min(1, dt * 16);

    if (keys['ArrowLeft']) p2Basket.targetX -= keySpeed * dt;
    if (keys['ArrowRight']) p2Basket.targetX += keySpeed * dt;
    p2Basket.targetX = clamp(p2Basket.targetX, MID_X + 50, W - BASKET_HALF_TOP - 20);
    p2Basket.x += (p2Basket.targetX - p2Basket.x) * Math.min(1, dt * 16);

    const allSpawned = p1Idx >= p1Sequence.length && p2Idx >= p2Sequence.length;
    if (!allSpawned) {
      if (spawnCooldown > 0) spawnCooldown -= dt;
      if (spawnCooldown <= 0 && hanziList.length < MAX_FALLING * 2) {
        spawnHanzi();
        spawnCooldown = lv.interval + Math.random() * 0.8;
      }
    } else if (!finished && hanziList.length === 0) {
      finished = true;
      endTimer = 0.6;
    }

    if (finished) {
      endTimer -= dt;
      if (endTimer <= 0) { endLevel(); return; }
    }

    const zone1 = { x: p1Basket.x - 64, y: 640, w: 128, h: 52 };
    const zone2 = { x: p2Basket.x - 64, y: 640, w: 128, h: 52 };

    for (let i = hanziList.length - 1; i >= 0; i--) {
      const h = hanziList[i];
      h.y += lv.fallSpeed * dt;

      const box = { x: h.x - 24, y: h.y - 56, w: 48, h: 56 };
      const owner = h.owner;
      const zone = owner === 1 ? zone1 : zone2;

      if (!h.dead && hit(box, zone)) {
        h.dead = true;
        if (h.isTarget) {
          if (owner === 1) { p1Score += 10; p1Correct++; }
          else { p2Score += 10; p2Correct++; }
          burst(h.x, 660, '#4ade80', 14);
          addFloater(h.x, 590, '+10', '#16a34a');
          flash('rgb(120,255,170)', 0.12);
          beep(880, 0.10, 'sine', 0.06);
        } else {
          if (owner === 1) { p1Score -= 5; p1Wrong++; }
          else { p2Score -= 5; p2Wrong++; }
          burst(h.x, 660, '#f87171', 14);
          addFloater(h.x, 590, '−5', '#dc2626');
          flash('rgb(255,90,90)', 0.22);
          shake(6);
          beep(180, 0.18, 'sawtooth', 0.05);
        }
      }

      if (h.dead || h.y > 740) {
        if (!h.dead && h.isTarget) {
          if (owner === 1) { p1Score -= 5; p1Missed++; }
          else { p2Score -= 5; p2Missed++; }
          addFloater(h.x, 620, '漏掉了 −5', '#dc2626');
          flash('rgb(255,140,90)', 0.1);
          beep(240, 0.14, 'triangle', 0.04);
        }
        hanziList.splice(i, 1);
      }
    }

    updateHUD();
  }

  const p1ScoreEl = document.getElementById('p1Score');
  const p2ScoreEl = document.getElementById('p2Score');
  let lastP1 = null, lastP2 = null;

  function updateHUD() {
    if (lastP1 !== p1Score) { p1ScoreEl.textContent = p1Score; lastP1 = p1Score; }
    if (lastP2 !== p2Score) { p2ScoreEl.textContent = p2Score; lastP2 = p2Score; }
  }

  function endLevel() {
    state = 'result';

    const p1Win = p1Score > p2Score;
    const p2Win = p2Score > p1Score;
    const tie = p1Score === p2Score;

    const area = document.getElementById('vsResultArea');
    let html = `
      <div class="vs-side ${p1Win ? 'winner' : ''}">
        <div class="name-big">🧑‍🎓 玩家 1</div>
        <div class="score-big">${p1Score}</div>
        <div class="detail">接對 ${p1Correct} · 接錯 ${p1Wrong} · 漏接 ${p1Missed}</div>
      </div>
      <div class="center-vs">VS</div>
      <div class="vs-side ${p2Win ? 'winner' : ''}">
        <div class="name-big">玩家 2 🧑‍🎓</div>
        <div class="score-big">${p2Score}</div>
        <div class="detail">接對 ${p2Correct} · 接錯 ${p2Wrong} · 漏接 ${p2Missed}</div>
      </div>
    `;
    area.innerHTML = html;

    const encourage = document.getElementById('encourageMsg');
    if (tie) {
      encourage.textContent = '🤝 平手！你們都很棒，繼續加油！';
    } else if (p1Win) {
      encourage.textContent = '🎉 玩家 1 獲勝！玩家 2 別灰心，繼續加油！';
    } else {
      encourage.textContent = '🎉 玩家 2 獲勝！玩家 1 別灰心，繼續加油！';
    }

    const btnNext = document.getElementById('btnNext');
    if (levelIdx < LEVELS.length - 1) {
      btnNext.style.display = '';
      btnNext.textContent = '下一關';
    } else {
      btnNext.style.display = 'none';
    }

    document.getElementById('result').classList.remove('hidden');
    document.getElementById('dualHud').classList.add('hidden');

    if (!tie) {
      beep(660, 0.12, 'sine', 0.07);
      setTimeout(() => beep(880, 0.12, 'sine', 0.07), 120);
      setTimeout(() => beep(1180, 0.2, 'sine', 0.07), 250);
    } else {
      beep(520, 0.15, 'sine', 0.06);
      setTimeout(() => beep(520, 0.15, 'sine', 0.06), 150);
    }
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, '#bfe6ff');
    g.addColorStop(1, '#eaf8ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND_Y);

    ctx.fillStyle = 'rgba(255,240,170,0.55)';
    ctx.beginPath(); ctx.arc(1240, 120, 78, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,226,110,0.95)';
    ctx.beginPath(); ctx.arc(1240, 120, 52, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(168,214,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(-40, GROUND_Y);
    ctx.quadraticCurveTo(200, 420, 480, GROUND_Y);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(600, GROUND_Y);
    ctx.quadraticCurveTo(900, 390, 1400, GROUND_Y);
    ctx.closePath(); ctx.fill();

    const gg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    gg.addColorStop(0, '#95dd8e');
    gg.addColorStop(1, '#57b053');
    ctx.fillStyle = gg;
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillStyle = '#b0eba8';
    ctx.fillRect(0, GROUND_Y, W, 6);

    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    ctx.setLineDash([14, 18]);
    ctx.beginPath();
    ctx.moveTo(MID_X, 80);
    ctx.lineTo(MID_X, GROUND_Y - 10);
    ctx.stroke();
    ctx.restore();
  }

  function drawClouds() {
    for (let c of clouds) {
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      const parts = [
        [c.x, c.y, 26], [c.x + 30, c.y + 8, 20], [c.x - 30, c.y + 10, 18], [c.x + 3, c.y - 16, 21]
      ];
      for (let p of parts) {
        ctx.beginPath();
        ctx.arc(p[0], p[1], p[2] * c.s, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawHanzi() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    for (let h of hanziList) {
      const y = h.y + Math.sin(elapsed * 2.5 + h.phase) * 3;
      ctx.save();
      ctx.font = '700 60px ' + FONT;
      ctx.shadowColor = h.owner === 1 ? 'rgba(30,80,160,0.4)' : 'rgba(120,40,140,0.4)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 4;
      ctx.fillStyle = h.owner === 1 ? '#1e3a8a' : '#4c1d95';
      ctx.fillText(h.char, h.x, y);
      ctx.restore();
    }
  }

  function drawBasket(basket, color1, color2, stroke, radical) {
    const cx = basket.x;
    const top = BASKET_TOP, bot = BASKET_BOTTOM;
    const ht = BASKET_HALF_TOP, hb = BASKET_HALF_BOT;

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#0b2a44';
    ctx.beginPath();
    ctx.ellipse(cx, bot + 8, hb + 10, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.moveTo(cx - ht, top);
    ctx.lineTo(cx + ht, top);
    ctx.lineTo(cx + hb, bot);
    ctx.lineTo(cx - hb, bot);
    ctx.closePath();

    const g = ctx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, color1);
    g.addColorStop(1, color2);
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(0,0,0,.2)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 6;
    ctx.fill();
    ctx.shadowColor = 'transparent';

    ctx.strokeStyle = stroke;
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(cx, top, ht, 15, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(cx, top + 3, ht - 12, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,.1)';
    ctx.fill();

    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 46px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.3)';
    ctx.shadowBlur = 5;
    ctx.fillText(radical, cx, top + 56);
    ctx.restore();
  }

  function drawParticles() {
    for (let p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let f of floaters) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life / 0.5));
      ctx.font = '800 32px ' + FONT;
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (shakeT > 0) {
      const m = shakeMag * (shakeT / 0.25);
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }

    drawBackground();
    drawClouds();

    if (state === 'playing' || state === 'result') {
      drawHanzi();
      drawBasket(p1Basket, lv.color1, lv.color2, lv.stroke, lv.radical);
      drawBasket(p2Basket, lv.color1, lv.color2, lv.stroke, lv.radical);
    }

    drawParticles();
    drawFloaters();

    ctx.restore();

    if (flashAlpha > 0) {
      ctx.globalAlpha = flashAlpha;
      ctx.fillStyle = flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  let lastTime = 0;
  function loop(t) {
    if (!lastTime) lastTime = t;
    let dt = (t - lastTime) / 1000;
    lastTime = t;
    if (dt > 0.05) dt = 0.05;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function getCanvasX(e) {
    const rect = cvs.getBoundingClientRect();
    return clamp((e.clientX - rect.left) / rect.width * W, 0, W);
  }

  cvs.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (err) { }
    if (state !== 'playing') return;
    const x = getCanvasX(e);
    if (x < MID_X) {
      p1Basket.targetX = clamp(x, BASKET_HALF_TOP + 20, MID_X - 50);
    } else {
      p2Basket.targetX = clamp(x, MID_X + 50, W - BASKET_HALF_TOP - 20);
    }
  }, { passive: false });

  cvs.addEventListener('pointermove', function (e) {
    if (state !== 'playing') return;
    e.preventDefault();
    const x = getCanvasX(e);
    if (x < MID_X) {
      p1Basket.targetX = clamp(x, BASKET_HALF_TOP + 20, MID_X - 50);
    } else {
      p2Basket.targetX = clamp(x, MID_X + 50, W - BASKET_HALF_TOP - 20);
    }
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (['ArrowLeft','ArrowRight','a','A','d','D',' '].includes(e.key)) {
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', function (e) {
    keys[e.key] = false;
  });

  (function buildLevelCards() {
    const grid = document.getElementById('levelGrid');
    LEVELS.forEach(function (level, i) {
      const btn = document.createElement('button');
      btn.className = 'level-card c' + (i + 1);
      btn.innerHTML =
        '<span class="r">' + level.radical + '</span>' +
        '<span class="n">第' + (i + 1) + '關 ' + level.name + '</span>' +
        '<span class="d">' + level.radicalName + '</span>';
      btn.addEventListener('click', function () {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (err) { }
        startLevel(i);
      });
      grid.appendChild(btn);
    });
  })();

  document.getElementById('btnRetry').addEventListener('click', function () {
    startLevel(levelIdx);
  });
  document.getElementById('btnNext').addEventListener('click', function () {
    if (levelIdx < LEVELS.length - 1) startLevel(levelIdx + 1);
  });
  document.getElementById('btnMenu').addEventListener('click', function () {
    state = 'menu';
    document.getElementById('result').classList.add('hidden');
    document.getElementById('dualHud').classList.add('hidden');
    document.getElementById('menu').classList.remove('hidden');
  });

})();
</script>
</body>
</html>
